[workspace]
members = [
    "crates/etr-config",
    "crates/etr-control",
    "crates/etrd",
    "crates/etr-types",
    "ebpf/etr-ebpf",
]
default-members = [
    "crates/etr-config",
    "crates/etr-control",
    "crates/etrd",
    "crates/etr-types",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "2604.13.1"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
aya = "0.13.1"
axum = { version = "0.8.6", features = ["json", "macros"] }
clap = { version = "4.5.49", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
